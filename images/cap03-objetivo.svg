<rect x="325" y="284" width="470" height="78" rx="10" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
<circle cx="357" cy="323.0" r="18" fill="#2E75B6"/>
<text x="357" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="387" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Reformular la recomendación con condiciones,</text>
<text x="387" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">mitigaciones e información pendiente</text>
<line x1="277" y1="238.0" x2="319" y2="238.0" stroke="#595959" stroke-width="2" marker-end="url(#a)"/>
