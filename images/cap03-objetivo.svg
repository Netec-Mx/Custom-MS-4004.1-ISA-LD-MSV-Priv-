<text x="30" y="32" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="start">Práctica 3. Fortalecer una propuesta de inversión</text>
<text x="30" y="56" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#DDE8F5" font-weight="normal" text-anchor="start">Herramienta principal: Entrenador de ideas (Idea Coach)</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#595959"/></marker></defs>
<rect x="25" y="100" width="250" height="340" rx="10" fill="#EAF1FB" stroke="#2E75B6" stroke-width="2"/>
<text x="45" y="130" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1F4E79" font-weight="bold" text-anchor="start">Insumos</text>
<text x="45" y="160" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">•</text>
<text x="45" y="177" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Propuesta_Modernizacion_Activos.docx</text>
<text x="45" y="202" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">• Restricciones de CAPEX y</text>
<text x="45" y="219" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">gobierno</text>
<text x="45" y="244" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">• Resultados de las prácticas</text>
<text x="45" y="261" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#222" font-weight="normal" text-anchor="start">1 y 2</text>
<rect x="325" y="100" width="470" height="78" rx="10" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
<circle cx="357" cy="139.0" r="18" fill="#2E75B6"/>
<text x="357" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="387" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Presentar la propuesta al agente y delimitar la</text>
<text x="387" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">revisión</text>
