<rect x="325" y="192" width="470" height="78" rx="10" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
<circle cx="357" cy="231.0" r="18" fill="#2E75B6"/>
<text x="357" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="387" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Cuestionar supuestos financieros, operativos,</text>
<text x="387" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">tecnológicos y organizacionales</text>
